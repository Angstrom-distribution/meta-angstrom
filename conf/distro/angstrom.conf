#@--------------------------------------------------------------------
#@TYPE: Distribution
#@NAME: Angstrom <http://github.com/angstrom-distribution>
#@DESCRIPTION: A flexible Linux Distribution
#@MAINTAINER: Koen Kooi <koen@dominion.thruhere.net>
#@--------------------------------------------------------------------

require conf/distro/include/arm-defaults.inc

# Preserve original DISTRO value
USERDISTRO := "${DISTRO}"
DISTRO = "angstrom"
DISTRO_NAME = "Angstrom"

# BUILDNAME is the only key in the buildstats path
# (${TMPDIR}/buildstats/${BUILDNAME}/${PF}/<task>, buildstats.bbclass), and all
# writes there are append-mode. A constant value makes sequential builds --
# especially different MACHINEs sharing one TMPDIR -- silently overwrite each
# other's per-task timings. Keep it unique per build; no spaces, it is a
# directory name and an error-report filename.
BUILDNAME = "Angstrom-${DISTRO_VERSION}-${MACHINE}-${DATETIME}"

# Package(s) that configure opkg feed(s) for this distro. Images pull this in
# via ${DISTROFEEDCONFIGS} rather than hardcoding the package name, so a
# layer like meta-dominion doesn't need to know it's "angstrom-feed-configs"
# specifically.
DISTROFEEDCONFIGS ?= "angstrom-feed-configs"

TARGET_VENDOR = "-angstrom"
SDK_VENDOR = "-angstromsdk"

DISTRO_VERSION = "v2026.06"

TCMODE ?= "default"

# Define a default set of features
DISTRO_FEATURES:append = " alsa bluetooth wifi"
DISTRO_FEATURES:append = " efi largefile pam pni-names"
DISTRO_FEATURES:append = " systemd zeroconf"
DISTRO_FEATURES:append = " opencl opengl vulkan wayland x11 glvnd"
DISTRO_FEATURES:append = " polkit"

# Enabling FORTRAN
FORTRAN:forcevariable = ",fortran"

# The only sane way :)
INIT_MANAGER = "systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_dev_manager  = "udev"

# Set a default for EFI bootloaders
EFI_PROVIDER = "systemd-boot"

# Unlock multimedia
LICENSE_FLAGS_ACCEPTED += "commercial"

# Disable uninative
INHERIT:remove = "uninative"

#Name the generated images in a sane way
IMAGE_NAME = "${DISTRO_NAME}-${IMAGE_BASENAME}-${DISTRO_VERSION}-${MACHINE}"

# Put `deploy` front and center. DEPLOY_DIR/TI_COMMON_DEPLOY are set in
# fix-k3r5.inc (below) -- meta-ti-bsp's k3r5 multiconfig needs them kept
# separate from a plain TOPDIR-based DEPLOY_DIR, see that file.
DEPLOY_DIR_IMAGE = "${DEPLOY_DIR}/images/${MACHINE}"
IMAGE_FSTYPES:append = " tar.gz"
IMAGE_FSTYPES:remove = " tar.xz"

require conf/distro/include/fix-k3r5.inc

# Angstrom *always* has some form of release config, so error out if someone thinks he knows better 
DISTRO_CHECK := "${@d.getVar("DISTRO_VERSION",1) or bb.fatal('Remove this line or set a dummy DISTRO_VERSION if you really want to build an unversioned distro')}"

# Prefer pigz, it's much, much faster on multi-core systems
PREFERRED_PROVIDER_gzip-native = "pigz-native"

# linux-firmware/linux-firmware-src are allarch, so every MACHINE built
# into one TOPDIR shares the same package feed for them. meta-lts-mixins
# carries a newer linux-firmware (DEFAULT_PREFERENCE=-1, opt-in) that
# meta-qcom already prefers for its own machines via a :qcom override;
# prefer it distro-wide so every machine agrees on the same version --
# otherwise machines with different defaults take turns "downgrading"
# the shared feed and trip the version-going-backwards QA check.
DEFAULT_PREFERENCE:layer-lts-linux-firmware-mixin = "1"

# /etc/version is redundant with /etc/os-release; drop it.
INHERIT += "angstrom-remove-etc-version"


#Use this variable in feeds and other parts that need a URI
ANGSTROM_URI ?= "http://feeds.angstrom-distribution.org"

# TCLIBC and INHERIT_DISTRO's k3r5-scoped overrides are in fix-k3r5.inc.
ANGSTROM_PKG_FORMAT = "ipk"
PACKAGE_CLASSES = "package_${ANGSTROM_PKG_FORMAT}"


FEED_ARCH ?= "${TUNE_PKGARCH}"
TUNE_ARMPKGARCH = "${ARMPKGARCH}${ARMPKGSFX_DSP}${ARMPKGSFX_EABI}${ARMPKGSFX_ENDIAN}${ARMPKGSFX_FPU}"
FEED_ARCHS ?= "${TUNE_PKGARCH} ${TUNE_ARMPKGARCH}"

# set feed path variables
FEED_BASEPATH = "feeds/${DISTRO_VERSION}/${ANGSTROM_PKG_FORMAT}/${TCLIBC}/"

# Feed uploads (bitbake upload-packages) shell out to rsync/ssh, which are
# not in oe-core's default HOSTTOOLS; link them into the task PATH when the
# host has them (nonfatal, so builds without them are unaffected)
HOSTTOOLS_NONFATAL += "rsync ssh"
