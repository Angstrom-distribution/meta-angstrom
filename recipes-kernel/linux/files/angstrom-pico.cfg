# systemd hard requirements (DEVTMPFS, cgroups, event handling, mounts)
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_MEMCG=y
CONFIG_INOTIFY_USER=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EPOLL=y
CONFIG_FHANDLE=y
CONFIG_EVENTFD=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_NET=y
CONFIG_UNIX=y
CONFIG_INET=y

# EXPERT=y (tiny kernel-cache default) turns MULTIUSER/NAMESPACES/SHMEM from
# "default y" into prompts --allnoconfig answers "n" to. MULTIUSER+NAMESPACES
# gate the whole UTS/IPC/PID/USER/NET namespace submenu; SHMEM gates TMPFS,
# which systemd mounts unconditionally at /run.
CONFIG_MULTIUSER=y
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_USER_NS=y
CONFIG_NET_NS=y
CONFIG_SHMEM=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y

# SD rootfs storage. MMC_ARMMMCI is the current symbol for the PL180/PL181
# AMBA MMC host on the versatile platform -- MMCI_PL180 no longer exists.
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_ARMMMCI=y
CONFIG_EXT4_FS=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_MSDOS_PARTITION=y
# PARTITION_ADVANCED=y turns EFI_PARTITION from "default y" into a prompt
# --allnoconfig answers "n" to (same trap as MULTIUSER/SHMEM above). Without
# it the kernel enumerates no partitions on a GPT disk.
CONFIG_EFI_PARTITION=y

# qemuarmv5's runqemu attaches the rootfs as a PCI virtio-blk device with no
# explicit -device, so CONFIG_PCI is required or Kconfig dependency
# resolution silently drops VIRTIO_PCI/VIRTIO_BLK along with it.
# PCI_VERSATILE is the ARM Versatile/PB board's own PCI host-bridge driver.
CONFIG_PCI=y
CONFIG_PCI_VERSATILE=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_PCI_LEGACY=y
CONFIG_VIRTIO_BLK=y

# Networking for netd. NETDEVICES/VIRTIO_NET are needed for the
# virtio-net-pci device qemuarmv5's run script wires. PACKET is required
# too -- a DHCP client needs an AF_PACKET socket before it has an address.
CONFIG_NETDEVICES=y
CONFIG_VIRTIO_NET=y
CONFIG_PACKET=y

# USB host support via qemu's generic PCI OHCI controller (versatilepb has
# no USB controller of its own; CONFIG_PCI/CONFIG_PCI_VERSATILE above cover
# the host bridge). USB_STORAGE is built in, not modular: no module
# autoload path exists yet on this kernel.
CONFIG_USB=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_STORAGE=y

# drivers/usb/storage depends on SCSI (mid-layer) and needs BLK_DEV_SD
# (disk class driver) to actually create a /dev/sdX node -- USB_STORAGE
# alone isn't enough.
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y

# NAND + initramfs boot path
CONFIG_MTD=y
CONFIG_MTD_BLKDEVS=y
CONFIG_MTD_BLOCK=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y

# Network queueing discipline, required by the sysctl drop-in. NET_SCHED is
# the menuconfig gate NET_SCH_FQ_CODEL lives under -- off under --allnoconfig.
CONFIG_NET_SCHED=y
CONFIG_NET_SCH_FQ_CODEL=y

# Compressed memory swap: lzo-rle, the least CPU-intensive backend at pico's
# zram size. alldefconfig turns on all six zram backends by default, none
# gated behind ZRAM_BACKEND_LZO -- trim explicitly to the one pico uses.
CONFIG_ZRAM=y
CONFIG_ZRAM_BACKEND_LZO=y
# CONFIG_ZRAM_BACKEND_LZ4 is not set
# CONFIG_ZRAM_BACKEND_LZ4HC is not set
# CONFIG_ZRAM_BACKEND_ZSTD is not set
# CONFIG_ZRAM_BACKEND_DEFLATE is not set
# CONFIG_ZRAM_BACKEND_842 is not set
# CONFIG_ZRAM_WRITEBACK is not set
# CONFIG_ZRAM_MEMORY_TRACKING is not set
# CONFIG_ZRAM_MULTI_COMP is not set

# Without this, glibc/systemd's Thumb-mode signal-handling code path
# SIGILLs -- ARM_THUMB's own Kconfig help text says exactly this.
CONFIG_ARM_THUMB=y

# The arm-versatile-926ejs BSP kmeta turns VFP on unconditionally. Not
# needed -- pico's userspace is soft-float throughout.
# CONFIG_VFP is not set

# Fixes a reproducible systemd[1] SIGILL moments after start
# (r7=175/rt_sigprocmask). RSEQ is registered by glibc's per-thread TLS
# setup extremely early. SECCOMP matches pico's own DISTRO_FEATURES choice
# to keep seccomp.
CONFIG_RSEQ=y
CONFIG_MEMBARRIER=y
CONFIG_SECCOMP=y
CONFIG_COMPAT_32BIT_TIME=y

# CONFIG_MODULES is not set here; kernel is fully built-in on pico.
# Embedded config (IKCONFIG) is deliberately left off; it bloats the image.

# XZ over gzip/LZO: smallest kernel-image by a wide margin, at the cost of
# heavier decompression CPU time -- worth it for the 32 MiB NAND budget.
# CONFIG_KERNEL_GZIP is not set
CONFIG_KERNEL_XZ=y
