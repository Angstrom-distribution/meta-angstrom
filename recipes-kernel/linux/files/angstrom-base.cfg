# Distro-baseline kernel config fragment for all Angstrom machines.
# Sections below are scoped to what the distro's default image set
# (containers, nftables firewalling, IWD, zram) actually needs.

# Config introspection
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# Queueing -- CAKE/FQ_CoDel etc for the default queueing disciplines
CONFIG_NET_SCHED=y
CONFIG_NET_SCH_CAKE=y
CONFIG_NET_SCH_FQ_CODEL=y
CONFIG_NET_SCH_CODEL=y
CONFIG_NET_SCH_FQ=y
CONFIG_NET_SCH_PIE=y
CONFIG_NET_SCH_INGRESS=m

# nftables -- firewalling on every image
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NETFILTER_NETLINK=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_NETDEV=y
CONFIG_NFT_CT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y
CONFIG_NFT_REJECT=y
CONFIG_NFT_LOG=y
CONFIG_NFT_COUNTER=y
CONFIG_NFT_LIMIT=y
CONFIG_NFT_FIB_INET=y

# Container networking/storage -- podman/docker style setups
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_VETH=y
CONFIG_TUN=y
CONFIG_MACVLAN=m
CONFIG_IPVLAN=m
CONFIG_VLAN_8021Q=m
CONFIG_OVERLAY_FS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# BPF
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_EVENTS=y
CONFIG_CGROUP_BPF=y

# Process accounting
CONFIG_BSD_PROCESS_ACCT=y
CONFIG_BSD_PROCESS_ACCT_V3=y
CONFIG_TASKSTATS=y
CONFIG_TASK_DELAY_ACCT=y
CONFIG_TASK_XACCT=y
CONFIG_TASK_IO_ACCOUNTING=y

CONFIG_WIREGUARD=y

# IWD crypto deps (union of makeitwork.cfg and sunxi-features.cfg)
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_CRYPTO_USER_API_AEAD=y
CONFIG_KEY_DH_OPERATIONS=y
CONFIG_PKCS8_PRIVATE_KEY_PARSER=y
CONFIG_PKCS7_MESSAGE_PARSER=y
CONFIG_X509_CERTIFICATE_PARSER=y
CONFIG_ASYMMETRIC_KEY_TYPE=y
CONFIG_ASYMMETRIC_PUBLIC_KEY_SUBTYPE=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_ECB=y
CONFIG_CRYPTO_RSA=y
CONFIG_CRYPTO_MD4=y
CONFIG_CRYPTO_DES=y
CONFIG_CFG80211_CRDA_SUPPORT=y
CONFIG_BIG_KEYS=y

# Cgroups/namespaces -- the subset makeitwork.cfg and sunxi-features.cfg
# both already agree on; podman needs USER_NS plus this cgroup set.
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_SCHED=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_RT_GROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_RDMA=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CPUSETS=y
CONFIG_CPUSETS_V1=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_MISC=y
CONFIG_USER_NS=y

# Squashfs plus the zram/crypto pairing sunxi-features.cfg documents --
# ZRAM depends on one of CRYPTO_LZO/ZSTD/LZ4/LZ4HC/842, dropped silently
# by Kconfig if none of those are set elsewhere.
CONFIG_SQUASHFS=y
CONFIG_CRYPTO_LZO=y
CONFIG_CRYPTO_ZSTD=y
CONFIG_CRYPTO_LZ4=y
CONFIG_ZRAM=y
CONFIG_ZRAM_BACKEND_LZ4=y
CONFIG_ZRAM_BACKEND_ZSTD=y
CONFIG_ZRAM_BACKEND_LZO=y
CONFIG_ZRAM_WRITEBACK=y
CONFIG_ZRAM_MULTI_COMP=y
