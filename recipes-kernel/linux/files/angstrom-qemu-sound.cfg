# ALSA core plus the virtio sound driver, for qemu machines only.
# Without this the guest has no sound card at all, so ALSA clients such as
# Kodi fail every sink open (CActiveAESink::OpenSink - no sink was returned).
# Pairs with the virtio-sound-pci device runqemu is given via QB_OPT_APPEND.
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_PCM=y
CONFIG_SND_VIRTIO=y
