# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

distro: angstrom

defaults:
  repos:
    branch: wrynose

repos:
  bitbake:
    url: https://github.com/openembedded/bitbake
    branch: "2.18"
    layers:
      .: disabled

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core
    patches:
      rust-target-config-armv5-v5t:
        repo: angstrom
        path: patches/oe-core/0002-rust-target-config-fix-invalid-v5-v5te-armv5-LLVM-f.patch
      rust-target-config-thumb-mode-needs-thumb2:
        repo: angstrom
        path: patches/oe-core/0003-rust-target-config-only-request-thumb-mode-with-thu.patch
      openssh-fzero-call-used-regs-thumb1:
        repo: angstrom
        path: patches/oe-core/0004-openssh-disable-fzero-call-used-regs-used-probe-on-.patch
    layers:
      meta:

  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: wrynose/linux-firmware

  angstrom:

  meta-linux-mainline:
    url: https://github.com/betafive/meta-linux-mainline
    branch: main

  meta-arm:
    url: https://git.yoctoproject.org/git/meta-arm
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-ti:
    url: https://git.yoctoproject.org/git/meta-ti
    patches:
      mesa-pvr-glvnd-fix:
        repo: angstrom
        path: patches/meta-ti/0001-mesa-pvr-fix-glvnd-PREFERRED_PROVIDER-mismatch-and-.patch
      sdimage-2part-boot-mountpoint:
        repo: angstrom
        path: patches/meta-ti/0002-sdimage-2part.wks-give-the-boot-partition-a-mountpo.patch
    layers:
      meta-ti-bsp:

  meta-beagleboard:
    url: https://github.com/koenkooi/meta-beagleboard

  meta-dominion:
    url: https://github.com/koenkooi/meta-dominion

  meta-kodi:
    url: https://github.com/koenkooi/meta-kodi/

  meta-rockchip:
    url: https://git.yoctoproject.org/git/meta-rockchip

  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom

  meta-qcom-3rdparty:
    url: https://github.com/qualcomm-linux/meta-qcom-3rdparty

  meta-ai:
    url: https://github.com/qualcomm-linux/meta-ai

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    layers:
      meta-filesystems:
      meta-gnome:
      meta-initramfs:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:
      meta-xfce:

  meta-sdr:
    url: https://github.com/balister/meta-sdr.git
    branch: master
    commit: 563727209e5d8c7cdebc35157bab4dc07e8fb235

  meta-qt5:
    url: https://github.com/meta-qt5/meta-qt5.git
    branch: master
    commit: 25a900694852c40e0f7adea97837feaa1a4ccecf

  meta-sunxi:
    url: https://github.com/linux-sunxi/meta-sunxi
    branch: master
    commit: e035da43a1f5ae4782a90078875826ea64401a3e

  meta-meson:
    url: https://github.com/superna9999/meta-meson
    # No wrynose branch upstream yet -- pinned commit. LAYERSERIES_COMPAT
    # patched to add wrynose (patch 0002); the nocrypto tune fix (0001) is
    # what makes libretech-ac (La Frite) safe to build for real.
    branch: master
    commit: bc4bced07a532742b6dc5eb1de4897673ffb5576
    patches:
      libretech-ac-honour-nocrypto-tune:
        repo: angstrom
        path: patches/meta-meson/0001-libretech-ac.conf-honour-the-cortexa53-nocrypto-tune.patch
      layerseries-compat-wrynose:
        repo: angstrom
        path: patches/meta-meson/0002-layer.conf-add-wrynose-to-LAYERSERIES_COMPAT.patch
      machine-features-opted-out-rename:
        repo: angstrom
        path: patches/meta-meson/0003-amlogic-meson64.inc-rename-MACHINE_FEATURES_BACKFILL.patch
      amlogic-boot-fip-qemu-native-depends:
        repo: angstrom
        path: patches/meta-meson/0004-amlogic-boot-fip-add-missing-qemu-native-DEPENDS.patch
      relocate-wic-to-files-wic:
        repo: angstrom
        path: patches/meta-meson/0005-layer.conf-relocate-wic-to-files-wic.patch

  meta-java:
    url: https://github.com/koenkooi/meta-java
    # openjdk-8-native, for the Kodi SWIG/Groovy interface codegen step.

  meta-riscv:
    url: https://github.com/riscv/meta-riscv
    branch: wrynose

  meta-virtualization:
    url: https://git.yoctoproject.org/git/meta-virtualization

local_conf_header:
  base: |
    INHERIT += "buildstats buildstats-summary"
    INHERIT += "buildhistory"
    INHERIT += "rm_work"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},10G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},1G,1K \
      HALT,/tmp,10M,1K"
  virtualization:
    SKIP_META_VIRT_SANITY_CHECK = "1"
  sbom-cve-check: |
    # Same effect as OE_FRAGMENTS += "core/yocto/sbom-cve-check"
    # (meta/conf/fragments/yocto/sbom-cve-check.conf), applied directly
    # instead of via the fragment: the fragment's own SRCREV:pn-...
    # assignments are parsed as part of including the fragment file from
    # within bitbake.conf, which happens AFTER local.conf is evaluated --
    # so a pin placed here to override AUTOREV loses to the fragment's own
    # later-parsed assignment if OE_FRAGMENTS is used. Pinned (not
    # AUTOREV) so builds are reproducible and don't re-check network on
    # every invocation; bump deliberately, not automatically, to pull in
    # newer CVE data.
    INHERIT += "create-spdx"
    IMAGE_CLASSES:append = " sbom-cve-check"
    SRCREV:pn-sbom-cve-check-update-nvd-native = "1e9614fe4a213c845b2845a7f191a1e1c990468d"
    SRCREV:pn-sbom-cve-check-update-cvelist-native = "44014a83baa236e80162c7cb840158a0108da285"
    SPDX_INCLUDE_VEX = "all"
    SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-yocto = "1"

machine: unset

target:
  - core-image-base
  - console-base-image
