#@TYPE: Distribution
#@NAME: Angstrom-pico
#@DESCRIPTION: Angstrom, minus everything a 200MHz machine with 64MiB RAM cannot afford
#@MAINTAINER: Koen Kooi <koen@dominion.thruhere.net>

require conf/distro/angstrom.conf

DISTRO = "angstrom-pico"
DISTRO_NAME = "Angstrom-pico"

# Keep "angstrom" in the override chain (not just "angstrom-pico") so
# :angstrom-scoped bbappends in this layer still fire.
DISTROOVERRIDES = "angstrom:angstrom-pico"

# angstrom.conf hardcodes DISTRO = "angstrom" and derives BUILDNAME from it;
# re-derive so buildstats paths (${TMPDIR}/buildstats/${BUILDNAME}/...) don't
# collide with the parent distro.
BUILDNAME = "Angstrom-pico-${DISTRO_VERSION}-${MACHINE}-${DATETIME}"

# Two distros in one TOPDIR otherwise share TMPDIR, DEPLOY_DIR (${TOPDIR}/deploy,
# set in fix-k3r5.inc) and BUILDHISTORY_DIR, and ipks with identical
# name-PV-PR-arch but different content would overwrite each other in deploy/ipk.
TMPDIR = "${TOPDIR}/tmp-pico"
BUILDHISTORY_DIR = "${TOPDIR}/buildhistory-pico"

# Same shape as fix-k3r5.inc's own DEPLOY_DIR, which this would otherwise
# flat-out replace (angstrom.conf's require chain sets it first, so a plain
# assignment here wins over it): pico has never targeted a K3 board, but
# losing k3r5's private per-multiconfig deploy dir the moment pico is active
# isn't a safe default just because that combination hasn't happened yet.
DEPLOY_DIR = "${@ '${TMPDIR}/deploy-pico' if d.getVar('BB_CURRENT_MC') == 'k3r5' else '${TOPDIR}/deploy-pico' }"

# Feature subtraction. :remove is applied at final expansion, AFTER
# bitbake.conf:899 appends filter_default_features(), so one list covers both
# oe-core's DISTRO_FEATURES_DEFAULTS and angstrom.conf's own appends.
# ldconfig stays: this is glibc, not musl, and the dynamic linker relies
# on its cache.
DISTRO_FEATURES:remove = "nfc 3g \
                          x11 wayland vulkan opengl opencl glvnd \
                          pulseaudio \
                          pam polkit virtualization efi \
                          gobject-introspection-data debuginfod ptest \
                          multiarch"

# Same set, expressed as an opt-out for the entries that come from
# DISTRO_FEATURES_DEFAULTS -- redundant with the :remove above, kept because it
# is the documented mechanism and shows up in `bitbake -e` diffs more clearly.
DISTRO_FEATURES_OPTED_OUT:append = " nfc 3g x11 wayland \
                                     vulkan opengl pulseaudio \
                                     gobject-introspection-data debuginfod \
                                     ptest multiarch"

# FORTRAN in angstrom.conf is :forcevariable -- only another :forcevariable
# can clear it.
FORTRAN:forcevariable = ""

# Size/speed policy for a 200MHz single core: -Os over -O2. On ARMv4 this is
# usually also faster (I-cache pressure), but measure rather than assume.
FULL_OPTIMIZATION = "-Os ${DEBUG_LEVELFLAG}"

require conf/distro/include/pico-locales.inc
require conf/distro/include/pico-systemd.inc
require conf/distro/include/pico-stripping.inc
