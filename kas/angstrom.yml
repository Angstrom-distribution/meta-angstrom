# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

distro: angstrom

defaults:
  repos:
    branch: master

repos:
  bitbake:
    url: https://github.com/openembedded/bitbake
    layers:
      .: excluded

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core
    layers:
      meta:

  angstrom:

  meta-linux-mainline:
    url: https://github.com/betafive/meta-linux-mainline
    branch: main

  meta-arm:
    url: https://git.yoctoproject.org/git/meta-arm
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-ti:
    url: https://git.yoctoproject.org/git/meta-ti
    layers:
      meta-ti-bsp:

  meta-beagleboard:
    url: https://github.com/koenkooi/meta-beagleboard

  meta-dominion:
    url: https://github.com/koenkooi/meta-dominion

  meta-sdr:
    url: https://github.com/balister/meta-sdr.git
    branch: master
    commit: 563727209e5d8c7cdebc35157bab4dc07e8fb235

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    layers:
      meta-filesystems:
      meta-networking:
      meta-oe:
      meta-python:

  meta-qt5:
    url: https://github.com/meta-qt5/meta-qt5.git
    branch: master
    commit: 25a900694852c40e0f7adea97837feaa1a4ccecf
    patches:
      qtchooser-license-expr-fix:
        repo: angstrom
        path: patches/meta-qt5/0001-qtchooser-fix-ambiguous-LICENSE-expression-syntax.patch

local_conf_header:
  base: |
    INHERIT += "buildstats buildstats-summary"
    INHERIT += "buildhistory"
    INHERIT += "rm_work"

machine: unset

target:
  - core-image-base
  - console-base-image
